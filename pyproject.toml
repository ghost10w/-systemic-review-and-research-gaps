[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ureme"
version = "1.0.0"
description = "Unified Research & Meta-Analysis Engine: gap analysis, research proposals and PRISMA 2020 systematic reviews with meta-analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "python-docx>=1.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ureme = "ureme.cli:main"

[tool.setuptools.packages.find]
include = ["ureme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
